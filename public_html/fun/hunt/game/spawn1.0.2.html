<script type="text/javascript">
    var log = log4javascript.getDefaultLogger();
    // Create a PopUpAppender with default options
    var popUpAppender = new log4javascript.PopUpAppender();

    // Change the desired configuration options
    popUpAppender.setFocusPopUp(true);
    popUpAppender.setNewestMessageAtTop(true);

    // Add the appender to the logger
    log.addAppender(popUpAppender);

    //tm_g.log = log;

</script>

<script type="text/javascript">

    var img = new Image();
    img.src = "./images/ghost-mad-near.png";
    var imgHit = new Image();
    imgHit.src = "./images/ghost-mad-near-hit.png";
    gImage = {
        main: img,
        hit: imgHit
    };

    $(document).ready(function () {
        grid = new Grid({ xMax: 900, yMax: 300, numBlocks: 100 });
        grid.walls = [
        ];
        grid.update(grid.walls);
        grid.draw(grid.walls);

        //debugger;
        var vicinity1 = TM_gents__Vicinity.getVicinity({ name: "vicinity1" });
        vicinity1.grid = grid;

        $("#stopAgents").click(function() {
            vicinity1.stopAgents();
        });

        $("#restart").click(function() {
            window.location.reload();
        });

        var a1 = vicinity1.loadAgent({
            name: "agt1.0",
            lifespan: 50,
            behaviors: [{ behavior: simpleSpawnBehavior }],
            pulseInterval: 0,
            pulseDuration: 100,
            taskDelay: 1000,
            priorityManagerType: "most-effective",
            duringBirth: function(this_agent) {
                this_agent.remember({ name: "xMax", fact: grid.numBlocks });
                this_agent.remember({ name: "yMax", fact: grid.numBlocks - 4 });

                var dimensions = this_agent.recall({ name: "dimensions" });
                if (dimensions) {
                    dimensions.name = this_agent._name;
                }

            },
            onTerminate: function(this_agent) {
                var dimensions = this_agent.recall({ name: "dimensions" });
                dimensions.image = "hit";
                this.vicinity.grid.update([{name: this_agent._name, dimensions: dimensions}]);

                setTimeout(function() {
                    var oldVicinity = this_agent.vicinity;
                    oldVicinity.removeAgent(this_agent);

                    oldVicinity.grid.removeItem(this_agent._name);
                }, 15000);
            }
        });

        var a1Pos = { x: 65, y: 20, width: 1, height: 1, image: "main", name: a1._name};
        a1.remember({ name: "dimensions", fact: a1Pos });

        a1.onMove = function (moveArgs) {
            this.vicinity.grid.update(moveArgs);

            //this.vicinity.grid.draw();    // this causes too many updates to the canvas
        };

        a1.live();

        setInterval(function() {
            vicinity1.grid.draw();
        }, 100);


    });


</script>


<script type="text/javascript">
////////////////////////
var Grid = (function(){
		var Grid = function(gridArgs) {
			this.xStart = 0; this.xEnd = gridArgs.xMax + 1; this.xIncr = gridArgs.xMax / gridArgs.numBlocks;
			this.yStart = 0; this.yEnd = gridArgs.yMax + 1; this.yIncr = gridArgs.yMax / gridArgs.numBlocks;
            this.numBlocks = gridArgs.numBlocks;
			this.items = {};
            this.isRunning = true;
            this.count = 0;
		}
		
		Grid.prototype = {
			drawGrid: function(context) {
				for (var x = this.xStart; x < this.xEnd; x += this.xIncr) {
				  context.moveTo(x, 0);
				  context.lineTo(x, this.yEnd);
				}

				for (var y = this.yStart; y < this.yEnd; y += this.yIncr) {
				  context.moveTo(0, y);
				  context.lineTo(this.xEnd, y);
				}

				context.strokeStyle = "#ddd";
				context.stroke();
			},
			
			draw: function (walls) {
				var c_canvas = document.getElementById("cvs");	
				var context = c_canvas.getContext("2d");
				
				if (context) {	
					c_canvas.height = this.yEnd;
					c_canvas.width = this.xEnd;

					//this.drawGrid(context);
					this.drawItems(context);
				}
				else {
					console.log("No context found");
				}
			},
			
			drawItems: function(context) {
				var ths = this;
				for (key in this.items) {
					var item = this.items[key].new;
					context.fillStyle="#ddd";
                    if (item.color) {
                        context.fillStyle=item.color;
                        var x = ths.getXOffset(item.x);
                        var y = ths.getYOffset(item.y);
                        var width = item.width;
                        var height = item.height;
                        context.fillRect(x,y,width,height);
                    }
				    else if (item.image) {
                        var x = ths.getXOffset(item.x);
                        var y = ths.getYOffset(item.y);
                        var width = 20;
                        var height = 20;
                        context.drawImage(gImage[item.image], x, y, width, height);
                    }

                    context.fillStyle="black";
                    context.fillText(key, x+10, y+5);
				}
			},

            removeItem: function(key) {
                delete this.items[key];
            },
			
			getXOffset: function(x) {
				return x * this.xIncr;
			},
			
			getYOffset: function(y) {
				return y * this.yIncr;
			},
			
			getWidth: function(width) {
				return width * this.xIncr;
			},
			
			getHeight: function(height) {
				return height * this.yIncr;
			},
			
			update: function(itemsToUpdate) {
				var ths = this;
				itemsToUpdate.forEach(function(item) {
					var oldItem = null;
					var cachedItem = ths.items[item.name];
					if (cachedItem) {
						var currentItem = cachedItem.new;
						if (currentItem) {
							oldItem = currentItem;
						}
					}
					ths.items[item.name] = {"old": oldItem, "new": item.dimensions};
				});
			},

            getDistanceToItem: function(name, direction, x, y, width, height) {
                var distance = 0;
                var distanceLimit = 100;

                for (var i=0; i<distanceLimit; i++) {
                    distance++;
                    switch (direction) {
                        case "L":
                            x -= 1;
                            break;
                        case "R":
                            x += 1;
                            break;
                        case "U":
                            y -= 1;
                             break;
                        case "D":
                            y += 1;
                            break;
                    }

                    if (this.getClosestItem(name, direction, x, y, width, height)) {
                        return distance;
                    }
                }

                return distance;
            },

            getClosestItem: function(name, direction, x, y, width, height) {
				var ths = this;
				for (key in this.items) {
                    if (key != name) {
					    var item = this.items[key].new;
					
					    var x1 = ths.getXOffset(x);
					    var y1 = ths.getYOffset(y);
					    var w1 = ths.getWidth(width);
					    var h1 = ths.getHeight(height);

					    var x2 = ths.getXOffset(item.x);
					    var y2 = ths.getYOffset(item.y);
					    var w2 = ths.getWidth(item.width);
					    var h2 = ths.getHeight(item.height);
						
                        // increase boundary size
						switch (direction) {
							case "L":
								// left edge of agt vs right edge of obstacle
								if (this.intersects(x1,y1,w1,h1, x2, y2, w2, h2)) {
									return item;
								}								
								break;
							case "R":
								// right edge of agt vs left edge of obstacle
								if (this.intersects(x1,y1,w1,h1, x2, y2, w2, h2)) {
									return item;
								}									
								break;
							case "U":
								// top edge of agt vs bottom edge of obstacle
								if (this.intersects(x1,y1,w1,h1, x2, y2, w2, h2)) {
									return item;
								}									
								break;
							case "D":
								// bottom edge of agt vs top edge of obstacle
								if (this.intersects(x1,y1,w1,h1, x2, y2, w2, h2)) {
									return item;
								}									
								break;
						}						
                    }
				}

                return null;
            },

			// returns true if there is any overlap
			// params: x,y,w,h of two rectangles
			intersects: function(x1, y1, w1, h1, x2, y2, w2, h2) {
			  if (w2 !== Infinity && w1 !== Infinity) {
				w2 += x2;
				w1 += x1;
				if (isNaN(w1) || isNaN(w2) || x2 > w1 || x1 > w2) return false;
			  }
			  if (y2 !== Infinity && h1 !== Infinity) {
				h2 += y2;
				h1 += y1;
				if (isNaN(h1) || isNaN(y2) || y2 > h1 || y1 > h2) return false;
			  }
			  return true;
			},
			
			checkLineIntersection: function(line1StartX, line1StartY, line1EndX, line1EndY, line2StartX, line2StartY, line2EndX, line2EndY) {
				// if the lines intersect, the result contains the x and y of the intersection (treating the lines as infinite) and booleans for whether line segment 1 or line segment 2 contain the point
				var denominator, a, b, numerator1, numerator2, result = {
					x: null,
					y: null,
					onLine1: false,
					onLine2: false
				};
				denominator = ((line2EndY - line2StartY) * (line1EndX - line1StartX)) - ((line2EndX - line2StartX) * (line1EndY - line1StartY));
				if (denominator == 0) {
					return result;
				}
				a = line1StartY - line2StartY;
				b = line1StartX - line2StartX;
				numerator1 = ((line2EndX - line2StartX) * a) - ((line2EndY - line2StartY) * b);
				numerator2 = ((line1EndX - line1StartX) * a) - ((line1EndY - line1StartY) * b);
				a = numerator1 / denominator;
				b = numerator2 / denominator;

				// if we cast these lines infinitely in both directions, they intersect here:
				result.x = line1StartX + (a * (line1EndX - line1StartX));
				result.y = line1StartY + (a * (line1EndY - line1StartY));
			/*
					// it is worth noting that this should be the same as:
					x = line2StartX + (b * (line2EndX - line2StartX));
					y = line2StartX + (b * (line2EndY - line2StartY));
					*/
				// if line1 is a segment and line2 is infinite, they intersect if:
				if (a > 0 && a < 1) {
					result.onLine1 = true;
				}
				// if line2 is a segment and line1 is infinite, they intersect if:
				if (b > 0 && b < 1) {
					result.onLine2 = true;
				}
				// if line1 and line2 are segments, they intersect if both of the above are true
				return result;
            },
            moveWalls: function(walls) {
                //return; // don't move walls for now.
                if (walls) {
                    // randomly move walls.
                    var wallnum = this.getRandomNumber(1, walls.length-1);
                    var moveXorY = this.getRandomNumber(1, 2);      // 1:x, 2:y
                    var moveAmount = this.getRandomNumber(1, 5);    // 1..5 spots
                    var moveDirection = this.getRandomNumber(1, 2);     // 1: up, 2:down
                    var moveDirectionFlag = (moveDirection == 1) ? 1 : -1;

                    var wall = walls[wallnum];
                    if (wall) {
                        switch (moveXorY) {
                            case 1: //x
                                wall.dimensions.x += (moveAmount * moveDirectionFlag);
                                break;
                            case 2: //y
                                wall.dimensions.y += (moveAmount * moveDirectionFlag);
                                break;
                        }
                    }
                }
            },
            getRandomNumber: function(start, end) {
                return Math.floor(Math.random() * end) + start;
            }
			
		};
		
		return Grid;	
		
	})();
	
</script>
